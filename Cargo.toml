[workspace]
members = [
    "crates/shader_abi",
    "crates/engine",
    "crates/fx_fresnel_rim",
    "crates/game",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
winit = { version = "0.30.13", features = ["rwh_06"] }
glam = { version = "0.34.1", features = ["serde"] }
bytemuck = { version = "1.16.1", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.dev.package."*"]
codegen-units = 1
opt-level = 3

[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"
codegen-units = 1


[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
let_underscore_must_use = "deny"
unwrap_used = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"
todo = "warn"
